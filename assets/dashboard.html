<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>helm-x dashboard</title>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --border: #30363d;
  --fg: #e6edf3; --dim: #8b949e; --accent: #2f81f7;
  --ok: #3fb950; --bad: #f85149; --warn: #d29922;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.6 "Segoe UI", system-ui, sans-serif; padding: 24px; }
h1 { font-size: 20px; margin-bottom: 4px; }
.sub { color: var(--dim); margin-bottom: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.card h2 { font-size: 14px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--dim); }
.kv dd { word-break: break-all; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.badge.ok { background: rgba(63,185,80,.15); color: var(--ok); }
.badge.bad { background: rgba(248,81,73,.15); color: var(--bad); }
.btn { display: inline-block; margin: 8px 8px 0 0; padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: #21262d; color: var(--fg); cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { background: rgba(248,81,73,.15); border-color: var(--bad); color: var(--bad); }
#rules { list-style: none; }
#rules li { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; font-family: Consolas, monospace; }
#rules li .idx { color: var(--dim); min-width: 24px; }
#toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 18px; border-radius: 6px; background: var(--panel); border: 1px solid var(--border); opacity: 0; transition: opacity .3s; font-size: 13px; }
#toast.show { opacity: 1; }
.mono { font-family: Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<h1>helm-x</h1>
<div class="sub">Codex 环境控制 · <span class="mono" id="home"></span></div>

<div class="grid">
  <div class="card">
    <h2>注入状态</h2>
    <dl class="kv">
      <dt>AGENTS.md</dt><dd><span id="injected" class="badge">—</span></dd>
      <dt>资源体积</dt><dd class="mono" id="agents_bytes">—</dd>
      <dt>规则数</dt><dd class="mono" id="rules_count">—</dd>
    </dl>
    <button class="btn primary" onclick="act('/api/apply')">apply</button>
    <button class="btn danger" onclick="act('/api/remove')">remove</button>
  </div>

  <div class="card">
    <h2>TAMPER 规则</h2>
    <ul id="rules"><li>加载中…</li></ul>
  </div>

  <div class="card">
    <h2>子命令</h2>
    <dl class="kv">
      <dt>watch</dt><dd class="mono">helmx watch 60</dd>
      <dt>proxy</dt><dd class="mono">helmx proxy --listen 1800 --upstream &lt;relay&gt;</dd>
      <dt>mcp</dt><dd class="mono">helmx mcp</dd>
    </dl>
  </div>
</div>

<div id="toast"></div>

<script>
async function get(path) {
  const r = await fetch(path);
  return r.json();
}
function toast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = ok ? 'rgba(63,185,80,.15)' : 'rgba(248,81,73,.15)';
  t.style.borderColor = ok ? 'var(--ok)' : 'var(--bad)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
async function refresh() {
  try {
    const s = await get('/api/status');
    document.getElementById('home').textContent = s.home || '(not found)';
    const inj = document.getElementById('injected');
    inj.textContent = s.injected ? 'ACTIVE' : 'MISSING';
    inj.className = 'badge ' + (s.injected ? 'ok' : 'bad');
    document.getElementById('agents_bytes').textContent = s.agents_bytes + ' B';
    document.getElementById('rules_count').textContent = s.rules;

    const rules = await get('/api/rules');
    const ul = document.getElementById('rules');
    ul.innerHTML = '';
    if (!rules.length) {
      ul.innerHTML = '<li><span class="idx">—</span><span>无规则</span></li>';
    } else {
      rules.forEach(r => {
        const li = document.createElement('li');
        li.innerHTML = '<span class="idx">#' + r.id + '</span><span>' + r.pattern.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span>';
        ul.appendChild(li);
      });
    }
  } catch (e) {
    toast('刷新失败: ' + e, false);
  }
}
async function act(path) {
  try {
    const r = await fetch(path, { method: 'POST' });
    const j = await r.json();
    toast(j.ok ? 'OK' : '失败: ' + (j.error || r.status), j.ok);
    refresh();
  } catch (e) {
    toast('请求失败: ' + e, false);
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
