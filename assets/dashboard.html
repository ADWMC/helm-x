<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>helm-x</title>
<style>
/* ── glance-style design: single-hue HSL system ── */
:root {
  font-size: 10px;

  /* single hue family (240° blue-grey), all surfaces derived from bg lightness */
  --bgh: 240; --bgs: 8%; --bgl: 9%;
  --color-background: hsl(240, 8%, 9%);
  --color-widget: hsl(240, 8%, 10%);          /* bg + 1% */
  --color-widget-hover: hsl(240, 8%, 12%);
  --color-separator: hsl(240, 8%, 13%);
  --color-text-highlight: hsl(240, 8%, 85%);
  --color-text-base: hsl(240, 8%, 60%);
  --color-text-subdue: hsl(240, 8%, 38%);
  --color-accent: hsl(43, 50%, 70%);          /* single warm accent */
  --color-negative: hsl(0, 70%, 70%);

  --radius: 5px;
  --gap: 23px;
  --font-size-base: 1.3rem;
}
*, *::before, *::after { box-sizing: border-box; padding: 0; margin: 0; }
html { scrollbar-color: var(--color-text-subdue) transparent; }
body {
  font: 1.3rem/1.6 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
  font-variant-ligatures: none;
  color: var(--color-text-base);
  background: var(--color-background);
  padding: var(--gap);
  min-height: 100vh;
}
::selection { background: hsl(240, 8%, 29%); color: var(--color-text-highlight); }

/* ── top bar ── */
.topbar {
  display: flex; align-items: baseline; gap: 1.2rem;
  padding-bottom: 1.4rem; margin-bottom: var(--gap);
  border-bottom: 1px solid var(--color-separator);
}
.topbar .brand { font-size: 1.5rem; color: var(--color-text-highlight); letter-spacing: .05rem; }
.topbar .status { font-size: 1.2rem; }
.topbar .status .led {
  display: inline-block; width: .7em; height: .7em; border-radius: 50%;
  margin-right: .5em; vertical-align: baseline;
}
.topbar .status.ok { color: var(--color-accent); }
.topbar .status.ok .led { background: var(--color-accent); }
.topbar .status.bad { color: var(--color-negative); }
.topbar .status.bad .led { background: var(--color-negative); }
.topbar .meta { margin-left: auto; font-size: 1.15rem; color: var(--color-text-subdue); }

/* ── columns ── */
.columns { display: flex; gap: var(--gap); align-items: flex-start; }
.col-small { width: 300px; flex-shrink: 0; }
.col-full { flex: 1; min-width: 0; }
.col { display: flex; flex-direction: column; gap: var(--gap); }

/* ── widget ── */
.widget {
  background: var(--color-widget);
  border-radius: var(--radius);
  padding: 1.6rem 1.7rem;
}
.widget-title {
  font-size: 1.1rem; text-transform: uppercase; letter-spacing: .15rem;
  color: var(--color-text-subdue); margin-bottom: 1.2rem;
}
.widget-title .right { float: right; text-transform: none; letter-spacing: 0; }

/* ── kv rows (status) ── */
.kv { display: flex; flex-direction: column; gap: .9rem; }
.kv .row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.kv .k { color: var(--color-text-subdue); }
.kv .v { color: var(--color-text-highlight); font-size: 1.3rem; }
.kv .v.acc { color: var(--color-accent); }

/* ── actions ── */
.actions { display: flex; gap: 2rem; margin-top: 1.4rem; }
.btn {
  font: inherit; color: var(--color-text-subdue); background: none; border: 0;
  cursor: pointer; padding: .2rem 0; font-size: 1.3rem; transition: color .15s;
}
.btn:hover { color: var(--color-text-highlight); }
.btn.primary { color: var(--color-accent); }
.btn.primary:hover { color: hsl(43, 60%, 80%); }
.btn.danger:hover { color: var(--color-negative); }

/* ── rules list ── */
.rule {
  display: flex; align-items: baseline; gap: 1.2rem;
  padding: .8rem 0; border-bottom: 1px solid var(--color-separator);
  font-size: 1.2rem;
}
.rule:last-child { border-bottom: 0; }
.rule .idx { color: var(--color-text-subdue); min-width: 2.4rem; text-align: right; }
.rule .pat { flex: 1; color: var(--color-text-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rule .tag { font-size: 1.05rem; color: var(--color-accent); opacity: .8; }
.empty { color: var(--color-text-subdue); padding: 1rem 0; }

/* ── code ref ── */
.ref { display: flex; flex-direction: column; gap: .8rem; }
.ref .line { display: flex; gap: 1.2rem; font-size: 1.2rem; }
.ref .cmd { color: var(--color-text-highlight); }
.ref .desc { color: var(--color-text-subdue); }

/* ── toast ── */
#toast {
  position: fixed; bottom: 2.2rem; right: 2.2rem;
  padding: .9rem 1.6rem; border-radius: var(--radius);
  background: hsl(240, 8%, 13%); color: var(--color-text-highlight);
  font-size: 1.25rem; opacity: 0; transform: translateY(.6rem);
  transition: all .25s; pointer-events: none;
}
#toast.show { opacity: 1; transform: translateY(0); }
#toast.ok { box-shadow: inset 2px 0 0 var(--color-accent); }
#toast.err { box-shadow: inset 2px 0 0 var(--color-negative); }
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">helm-x</span>
  <span class="status" id="status"><span class="led"></span><span id="status-text">检测中</span></span>
  <span class="meta" id="home">—</span>
</div>

<div class="columns">
  <div class="col col-small">
    <div class="widget">
      <div class="widget-title">注入状态</div>
      <div class="kv">
        <div class="row"><span class="k">AGENTS.md</span><span class="v" id="agents_bytes">—</span></div>
        <div class="row"><span class="k">TAMPER 规则</span><span class="v acc" id="rules_count">—</span></div>
        <div class="row"><span class="k">Codex home</span><span class="v" id="home_short">—</span></div>
      </div>
      <div class="actions">
        <button class="btn primary" onclick="act('/api/apply')">apply</button>
        <button class="btn danger" onclick="act('/api/remove')">remove</button>
      </div>
    </div>

    <div class="widget">
      <div class="widget-title">子命令</div>
      <div class="ref">
        <div class="line"><span class="cmd">watch</span><span class="desc">helmx watch 60</span></div>
        <div class="line"><span class="cmd">proxy</span><span class="desc">--listen 1800 --upstream</span></div>
        <div class="line"><span class="cmd">mcp</span><span class="desc">helmx mcp</span></div>
      </div>
    </div>
  </div>

  <div class="col col-full">
    <div class="widget">
      <div class="widget-title">TAMPER 规则 <span class="right">pattern → replace</span></div>
      <div id="rules-list"><div class="empty">加载中…</div></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
async function get(path) { const r = await fetch(path); return r.json(); }
function toast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = ok ? 'show ok' : 'show err';
  setTimeout(() => t.className = '', 2400);
}
async function refresh() {
  try {
    const s = await get('/api/status');
    document.getElementById('home').textContent = s.home || '(not found)';
    document.getElementById('home_short').textContent = s.home || '(not found)';
    document.getElementById('agents_bytes').textContent = s.agents_bytes + ' B';
    document.getElementById('rules_count').textContent = s.rules;

    const st = document.getElementById('status');
    st.className = 'status ' + (s.injected ? 'ok' : 'bad');
    document.getElementById('status-text').textContent = s.injected ? 'ACTIVE' : 'MISSING';

    const rules = await get('/api/rules');
    const box = document.getElementById('rules-list');
    box.innerHTML = '';
    if (!rules.length) {
      box.innerHTML = '<div class="empty">无规则</div>';
    } else {
      rules.forEach(r => {
        const row = document.createElement('div');
        row.className = 'rule';
        row.innerHTML = '<span class="idx">' + r.id + '</span><span class="pat">' + r.pattern.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span><span class="tag">regex</span>';
        box.appendChild(row);
      });
    }
  } catch (e) { toast('刷新失败: ' + e, false); }
}
async function act(path) {
  try {
    const r = await fetch(path, { method: 'POST' });
    const j = await r.json();
    toast(j.ok ? '操作成功' : '失败: ' + (j.error || r.status), j.ok);
    refresh();
  } catch (e) { toast('请求失败: ' + e, false); }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
