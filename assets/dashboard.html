<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>helm-x</title>
<style>
/* ── Clash Verge-inspired: functional, restrained, single accent ── */
:root {
  --primary: #0A84FF;
  --bg: #2E303D;
  --bg-elev: #363846;
  --bg-hover: #3A3D4C;
  --divider: rgba(255, 255, 255, 0.08);
  --text-primary: #FFFFFF;
  --text-secondary: rgba(235, 235, 245, 0.6);
  --text-tertiary: rgba(235, 235, 245, 0.38);
  --ok: #30D158;
  --bad: #FF453A;
  --radius: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  user-select: none;
  overflow: hidden;
  display: flex;
}
.mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; }

/* ── left menu (200px) ── */
.menu {
  flex: 0 0 200px;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--divider);
  padding-bottom: 8px;
  height: 100vh;
}
.logo {
  height: 58px; padding: 0 20px;
  display: flex; align-items: center; gap: 10px;
  font-size: 15px; font-weight: 600; letter-spacing: .3px;
  flex-shrink: 0;
}
.logo .mark {
  width: 24px; height: 24px; border-radius: 6px;
  background: var(--primary);
  color: #fff; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.menu-items { flex: 1; padding-top: 4px; overflow-y: auto; scrollbar-width: none; }
.menu-items::-webkit-scrollbar { width: 0; }
.menu-item {
  display: flex; align-items: center; gap: 11px;
  margin: 0 8px 2px; padding: 9px 12px;
  border-radius: 7px;
  color: var(--text-secondary);
  font-size: 13.5px;
  cursor: pointer; user-select: none;
  transition: background .12s, color .12s;
}
.menu-item svg { width: 17px; height: 17px; opacity: .75; flex-shrink: 0; }
.menu-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.menu-item.active { background: var(--primary); color: #fff; font-weight: 500; }
.menu-item.active svg { opacity: 1; }
.menu-foot { padding: 0 20px 10px; }
.menu-foot .v { font-size: 11px; color: var(--text-tertiary); padding: 6px 12px; }

/* ── main ── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 58px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--divider);
}
.topbar .t { font-size: 16px; font-weight: 600; }
.topbar .right { display: flex; align-items: center; gap: 12px; }

/* status pill */
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 3px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 500;
  background: var(--bg-elev);
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; }
.pill.ok { color: var(--ok); }
.pill.ok .dot { background: var(--ok); }
.pill.bad { color: var(--bad); }
.pill.bad .dot { background: var(--bad); }

.content { flex: 1; overflow-y: auto; padding: 14px 20px 20px; scrollbar-gutter: stable; }
.content::-webkit-scrollbar { width: 8px; }
.content::-webkit-scrollbar-thumb { border-radius: 6px; background: rgba(255,255,255,.15); }

/* ── stat cards ── */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 14px; }
.stat {
  background: var(--bg-elev);
  border-radius: var(--radius);
  padding: 14px 16px;
  transition: background .12s;
}
.stat:hover { background: var(--bg-hover); }
.stat .l { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 7px; }
.stat .v { font-size: 20px; font-weight: 600; letter-spacing: .2px; }
.stat .h { font-size: 11px; color: var(--text-tertiary); margin-top: 3px; }

/* ── panels ── */
.panel {
  background: var(--bg-elev);
  border-radius: var(--radius);
  margin-bottom: 14px;
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--divider);
}
.panel-head .t { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.panel-head .r { font-size: 11px; color: var(--text-tertiary); }

/* ── rules ── */
.rule {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--divider);
  transition: background .1s;
}
.rule:last-child { border-bottom: 0; }
.rule:hover { background: var(--bg-hover); }
.rule .idx { font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--text-tertiary); min-width: 26px; text-align: right; }
.rule .pat { flex: 1; font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rule .tag { font-size: 10px; font-weight: 500; letter-spacing: .4px; padding: 1.5px 7px; border-radius: 4px; background: rgba(10, 132, 255, 0.15); color: var(--primary); }
.empty { padding: 22px 16px; color: var(--text-tertiary); font-size: 12px; text-align: center; }

/* ── buttons ── */
.actions { display: flex; gap: 10px; padding: 14px 16px; }
.btn {
  padding: 7px 16px; border-radius: 7px;
  font: 500 13px inherit;
  border: 0; cursor: pointer;
  transition: background .12s, opacity .12s;
}
.btn.primary { background: var(--primary); color: #fff; }
.btn.primary:hover { opacity: .85; }
.btn.secondary { background: var(--bg-hover); color: var(--text-primary); }
.btn.secondary:hover { background: rgba(255,255,255,.12); }
.btn.danger { background: rgba(255, 69, 58, 0.15); color: var(--bad); }
.btn.danger:hover { background: rgba(255, 69, 58, 0.25); }

/* ── ref ── */
.ref { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.ref .cell { padding: 11px 16px; border-bottom: 1px solid var(--divider); }
.ref .cell:last-child { border-bottom: 0; }
.ref .cmd { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--primary); }
.ref .desc { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

/* ── toast ── */
#toast {
  position: fixed; bottom: 20px; right: 20px;
  padding: 9px 16px; border-radius: 7px;
  background: var(--bg-elev);
  border: 1px solid var(--divider);
  font-size: 12.5px;
  opacity: 0; transform: translateY(8px); transition: all .2s;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateY(0); }
#toast.ok { box-shadow: inset 3px 0 0 var(--ok); }
#toast.err { box-shadow: inset 3px 0 0 var(--bad); }
</style>
</head>
<body>

<div class="menu">
  <div class="logo"><span class="mark">H</span>helm-x</div>
  <div class="menu-items">
    <div class="menu-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      状态
    </div>
    <div class="menu-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 13h6M9 17h4"/></svg>
      规则
    </div>
    <div class="menu-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
      命令
    </div>
  </div>
  <div class="menu-foot">
    <div class="v mono" id="home_short">—</div>
    <div class="v">v0.1.0 · C++17</div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="t">状态</div>
    <div class="right">
      <span id="injected" class="pill"><span class="dot"></span><span id="injected-text">检测中</span></span>
    </div>
  </div>

  <div class="content">
    <div class="stats">
      <div class="stat">
        <div class="l">AGENTS.md</div>
        <div class="v mono" id="agents_bytes">—</div>
        <div class="h mono" id="home">—</div>
      </div>
      <div class="stat">
        <div class="l">TAMPER 规则</div>
        <div class="v mono" id="rules_count">—</div>
        <div class="h">pattern → replace</div>
      </div>
      <div class="stat">
        <div class="l">注入状态</div>
        <div class="v" id="state_word">—</div>
        <div class="h" id="state_hint">—</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><span class="t">操作</span><span class="r">一键部署 / 恢复</span></div>
      <div class="actions">
        <button class="btn primary" onclick="act('/api/apply')">apply</button>
        <button class="btn danger" onclick="act('/api/remove')">remove</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><span class="t">TAMPER 规则</span><span class="r mono">regex</span></div>
      <div id="rules-list"><div class="empty">加载中…</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><span class="t">子命令</span><span class="r">CLI reference</span></div>
      <div class="ref">
        <div class="cell"><div class="cmd">helmx watch 60</div><div class="desc">自愈守护</div></div>
        <div class="cell"><div class="cmd">helmx proxy --listen 1800</div><div class="desc">篡改代理</div></div>
        <div class="cell"><div class="cmd">helmx mcp</div><div class="desc">MCP 服务器</div></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
async function get(path) { const r = await fetch(path); return r.json(); }
function toast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = ok ? 'show ok' : 'show err';
  setTimeout(() => t.className = '', 2400);
}
async function refresh() {
  try {
    const s = await get('/api/status');
    document.getElementById('home').textContent = s.home || '(not found)';
    document.getElementById('home_short').textContent = s.home || '(not found)';
    document.getElementById('agents_bytes').textContent = s.agents_bytes + ' B';
    document.getElementById('rules_count').textContent = s.rules;

    const p = document.getElementById('injected');
    const pt = document.getElementById('injected-text');
    if (s.injected) { p.className = 'pill ok'; pt.textContent = 'ACTIVE'; }
    else { p.className = 'pill bad'; pt.textContent = 'MISSING'; }

    document.getElementById('state_word').textContent = s.injected ? 'ACTIVE' : 'MISSING';
    document.getElementById('state_word').style.color = s.injected ? 'var(--ok)' : 'var(--bad)';
    document.getElementById('state_hint').textContent = s.injected ? '注入完整' : '需要 apply';

    const rules = await get('/api/rules');
    const box = document.getElementById('rules-list');
    box.innerHTML = '';
    if (!rules.length) {
      box.innerHTML = '<div class="empty">无规则</div>';
    } else {
      rules.forEach(r => {
        const row = document.createElement('div');
        row.className = 'rule';
        row.innerHTML = '<span class="idx">' + r.id + '</span><span class="pat">' + r.pattern.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span><span class="tag">REGEX</span>';
        box.appendChild(row);
      });
    }
  } catch (e) { toast('刷新失败: ' + e, false); }
}
async function act(path) {
  try {
    const r = await fetch(path, { method: 'POST' });
    const j = await r.json();
    toast(j.ok ? '操作成功' : '失败: ' + (j.error || r.status), j.ok);
    refresh();
  } catch (e) { toast('请求失败: ' + e, false); }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
